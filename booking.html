    <!-- ---------------------------booking form section--------------------- -->
    <section class="py-5 mt-5">
      <div class="container">
        <h2 class="text-center fw-bold mb-4">Book Your Trip</h2>
        <div class="row justify-content-center">
          <div class="col-md-8">
            <div class="card shadow">
              <div class="card-body">
                <form>
                  <div class="mb-3">
                    <label for="name" class="form-label">Full Name</label>
                    <input type="text" class="form-control" id="name" placeholder="Enter your name" required />
                  </div>
                  <div class="mb-3">
                    <label for="email" class="form-label">Email Address</label>
                    <input type="email" class="form-control" id="email" placeholder="Enter your email" required />
                  </div>
                  <div class="mb-3">
                    <label for="phone" class="form-label">Phone Number</label>
                    <input type="tel" class="form-control" id="phone" placeholder="Enter your phone number" required />
                  </div>
                  <div class="mb-3">
                    <label for="destination" class="form-label">Destination</label>
                    <select class="form-select" id="destination" required>
                      <option value="">Select a destination</option>
                      <option value="agra">Agra Heritage Package</option>
                      <option value="golden-triangle">Golden Triangle Tour</option>
                      <option value="kerala">Kerala Backwaters</option>
                      <option value="goa">Goa Beach Tour</option>
                    </select>
                  </div>
                  <div class="mb-3">
                    <label for="date" class="form-label">Travel Date</label>
                    <input type="date" class="form-control" id="date" required />
                  </div>
                  <div class="mb-3">
                    <label for="guests" class="form-label">Number of Guests</label>
                    <input type="number" class="form-control" id="guests" min="1" placeholder="Number of guests" required />
                  </div>
                  <div class="mb-3">
                    <label for="message" class="form-label">Special Requests</label>
                    <textarea class="form-control" id="message" rows="3" placeholder="Any special requests"></textarea>
                  </div>
                  <button type="submit" class="btn btn-primary w-100">Submit Booking</button>
                </form>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
